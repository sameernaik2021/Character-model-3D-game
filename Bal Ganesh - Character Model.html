<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bal Ganesh - Character Model</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 25%, #fff7c7, transparent 30%),
        linear-gradient(#75d5ff, #dff7ff);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 420px;
    height: 680px;
}

/* ---------- GROUND ---------- */

.ground {
    position: absolute;
    bottom: 25px;
    left: 45px;
    width: 330px;
    height: 55px;
    background: #68b947;
    border-radius: 50%;
    box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

/* ---------- CHARACTER ---------- */

.character {
    position: absolute;
    width: 260px;
    height: 600px;
    left: 80px;
    bottom: 55px;
}

/* ---------- EARS ---------- */

.ear {
    position: absolute;
    top: 65px;
    width: 95px;
    height: 150px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 70% 30% 50% 50%;
    z-index: 1;
}

.ear.left {
    left: -25px;
    transform: rotate(-12deg);
}

.ear.right {
    right: -25px;
    transform: scaleX(-1) rotate(-12deg);
}

.ear::after {
    content: "";
    position: absolute;
    inset: 22px;
    background: #f4b878;
    border-radius: 70% 30% 50% 50%;
}

/* ---------- HEAD ---------- */

.head {
    position: absolute;
    top: 35px;
    left: 40px;
    width: 180px;
    height: 205px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 48% 48% 45% 45%;
    z-index: 3;
}

/* ---------- CROWN ---------- */

.crown {
    position: absolute;
    top: -45px;
    left: 40px;
    width: 100px;
    height: 70px;
    background: linear-gradient(90deg, #f4b52b, #ffd95c, #e69b13);
    border: 5px solid #7c4a13;
    clip-path: polygon(
        0 100%,
        12% 35%,
        35% 65%,
        50% 0,
        65% 65%,
        88% 35%,
        100% 100%
    );
    z-index: 6;
}

.crown-jewel {
    position: absolute;
    width: 18px;
    height: 18px;
    left: 41px;
    bottom: 10px;
    background: #e33c2e;
    border: 3px solid #7c2118;
    border-radius: 50%;
}

/* ---------- TILAK ---------- */

.tilak {
    position: absolute;
    top: 40px;
    left: 77px;
    width: 25px;
    height: 35px;
    background: #d93225;
    border-radius: 50% 50% 45% 45%;
}

/* ---------- EYES ---------- */

.eye {
    position: absolute;
    top: 82px;
    width: 48px;
    height: 52px;
    background: white;
    border: 4px solid #5c2c1b;
    border-radius: 50%;
}

.eye.left {
    left: 25px;
}

.eye.right {
    right: 25px;
}

.pupil {
    position: absolute;
    width: 18px;
    height: 24px;
    top: 12px;
    left: 12px;
    background: #24150f;
    border-radius: 50%;
}

.pupil::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 7px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
}

/* ---------- TRUNK ---------- */

.trunk {
    position: absolute;
    top: 105px;
    left: 70px;
    width: 65px;
    height: 125px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-top: none;
    border-radius: 15px 15px 45px 45px;
    transform: rotate(5deg);
    z-index: 7;
}

.trunk-tip {
    position: absolute;
    bottom: -5px;
    left: 8px;
    width: 42px;
    height: 35px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 50%;
}

/* ---------- MOUTH ---------- */

.mouth {
    position: absolute;
    left: 62px;
    top: 165px;
    width: 55px;
    height: 25px;
    border-bottom: 5px solid #6b241c;
    border-radius: 50%;
}

/* ---------- NECK ---------- */

.neck {
    position: absolute;
    top: 220px;
    left: 100px;
    width: 60px;
    height: 45px;
    background: #dc884d;
    border: 5px solid #6b351d;
    z-index: 2;
}

/* ---------- BODY ---------- */

.body {
    position: absolute;
    top: 245px;
    left: 45px;
    width: 170px;
    height: 180px;
    background: #f0a51a;
    border: 5px solid #6b351d;
    border-radius: 45px 45px 30px 30px;
    z-index: 3;
}

/* ---------- NECKLACE ---------- */

.necklace {
    position: absolute;
    top: 245px;
    left: 70px;
    width: 120px;
    height: 65px;
    border-bottom: 8px solid #ffd23d;
    border-radius: 0 0 60px 60px;
    z-index: 5;
}

.bead {
    position: absolute;
    width: 13px;
    height: 13px;
    background: #f8ca2c;
    border: 2px solid #8b5c12;
    border-radius: 50%;
}

.bead:nth-child(1) { left: 8px; top: 8px; }
.bead:nth-child(2) { left: 32px; top: 28px; }
.bead:nth-child(3) { left: 55px; top: 39px; }
.bead:nth-child(4) { left: 78px; top: 28px; }
.bead:nth-child(5) { left: 100px; top: 8px; }

/* ---------- ARMS ---------- */

.arm {
    position: absolute;
    top: 260px;
    width: 55px;
    height: 145px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 35px;
    z-index: 2;
}

.arm.left {
    left: 5px;
    transform: rotate(18deg);
}

.arm.right {
    right: 5px;
    transform: rotate(-18deg);
}

.hand {
    position: absolute;
    bottom: -28px;
    left: 1px;
    width: 55px;
    height: 55px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 50%;
}

/* ---------- DHOTI ---------- */

.dhoti {
    position: absolute;
    top: 405px;
    left: 48px;
    width: 165px;
    height: 90px;
    background: #fff1c7;
    border: 5px solid #6b351d;
    border-radius: 15px 15px 35px 35px;
    z-index: 4;
}

.dhoti-fold {
    position: absolute;
    top: 5px;
    left: 75px;
    width: 5px;
    height: 75px;
    background: #d6a85d;
}

/* ---------- LEGS ---------- */

.leg {
    position: absolute;
    top: 470px;
    width: 65px;
    height: 90px;
    background: #e99a5b;
    border: 5px solid #6b351d;
    border-radius: 20px 20px 35px 35px;
    z-index: 2;
}

.leg.left {
    left: 55px;
}

.leg.right {
    right: 55px;
}

/* ---------- FEET ---------- */

.foot {
    position: absolute;
    top: 535px;
    width: 85px;
    height: 48px;
    background: #8b4c27;
    border: 5px solid #542918;
    border-radius: 50% 50% 35% 35%;
    z-index: 3;
}

.foot.left {
    left: 30px;
}

.foot.right {
    right: 30px;
}

/* ---------- ANIMATION ---------- */

.character {
    animation: gentleBounce 2s ease-in-out infinite;
}

@keyframes gentleBounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }
}

/* ---------- TITLE ---------- */

.title {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 8px 20px;
    border-radius: 20px;
    font-weight: bold;
    color: #743719;
    box-shadow: 0 4px 15px rgba(0,0,0,.18);
}
</style>
</head>

<body>

<div class="scene">

    <div class="ground"></div>

    <div class="character">

        <!-- Ears -->
        <div class="ear left"></div>
        <div class="ear right"></div>

        <!-- Head -->
        <div class="head">

            <!-- Crown -->
            <div class="crown">
                <div class="crown-jewel"></div>
            </div>

            <!-- Tilak -->
            <div class="tilak"></div>

            <!-- Eyes -->
            <div class="eye left">
                <div class="pupil"></div>
            </div>

            <div class="eye right">
                <div class="pupil"></div>
            </div>

            <!-- Trunk -->
            <div class="trunk">
                <div class="trunk-tip"></div>
            </div>

            <!-- Smile -->
            <div class="mouth"></div>

        </div>

        <!-- Neck -->
        <div class="neck"></div>

        <!-- Arms -->
        <div class="arm left">
            <div class="hand"></div>
        </div>

        <div class="arm right">
            <div class="hand"></div>
        </div>

        <!-- Body -->
        <div class="body"></div>

        <!-- Necklace -->
        <div class="necklace">
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
            <div class="bead"></div>
        </div>

        <!-- Dhoti -->
        <div class="dhoti">
            <div class="dhoti-fold"></div>
        </div>

        <!-- Legs -->
        <div class="leg left"></div>
        <div class="leg right"></div>

        <!-- Feet -->
        <div class="foot left"></div>
        <div class="foot right"></div>

    </div>

    <div class="title">Bal Ganesh – Character Model</div>

</div>

<script>
/*
 * Simple character interaction.
 * Click the character to make it jump.
 */

const character = document.querySelector(".character");

character.addEventListener("click", () => {
    character.animate(
        [
            { transform: "translateY(0) scale(1)" },
            { transform: "translateY(-45px) scale(1.03)" },
            { transform: "translateY(0) scale(1)" }
        ],
        {
            duration: 600,
            easing: "ease-out"
        }
    );
});
</script>

</body>
</html>
